<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Iniciar Sesión - Tienda</title>
  <style>
    :root {
      --bg-page: #FBF4EA;
      --bg-card: #FFFFFF;
      --coral: #F7BFB6;
      --coral-active: #FF6F59;
      --text: #2B2B2B;
      --muted: #857F76;
      --border: #EDE3D4;
      --shadow: 0 12px 32px rgba(43,32,20,0.12);
      --ok-green: #25d366;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background-color: var(--bg-page);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; min-height: 100dvh;
    }
    .login-container { width: 100%; max-width: 400px; padding: 20px; }
    .card {
      background: var(--bg-card); border-radius: 24px; padding: 40px 30px;
      box-shadow: var(--shadow); text-align: center;
    }
    .logo-circle {
      width: 80px; height: 80px; background-color: var(--coral);
      border-radius: 50%; margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: center; font-size: 32px;
    }
    .card h1 { margin: 0 0 8px; font-size: 24px; }
    .card .subtitle { margin: 0 0 30px; color: var(--muted); font-size: 14px; }
    .form-group { margin-bottom: 20px; text-align: left; }
    .form-group label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .input-wrap { position: relative; }
    .form-control {
      width: 100%; padding: 14px 16px; border: 1px solid var(--border);
      border-radius: 12px; font-size: 15px; font-family: inherit;
      background-color: #FAFAFA; transition: border-color 0.2s;
    }
    .input-wrap .form-control.has-toggle { padding-right: 48px; }
    .form-control:focus { outline: none; border-color: var(--coral-active); background-color: #FFF; }
    .form-control:disabled { opacity: 0.6; cursor: not-allowed; }
    .toggle-pass {
      position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
      background: transparent; border: none; padding: 8px; cursor: pointer;
      color: var(--muted); font-size: 16px;
    }
    .btn-login {
      width: 100%; background-color: var(--coral-active); color: white;
      border: none; padding: 14px; border-radius: 12px; font-size: 16px;
      font-weight: 700; cursor: pointer; transition: filter 0.2s; margin-top: 10px;
    }
    .btn-login:hover:not(:disabled) { filter: brightness(1.05); }
    .btn-login:disabled { cursor: not-allowed; opacity: 0.7; }
    .btn-login.success { background-color: var(--ok-green); }
    .error-msg {
      color: #e74c3c; font-size: 13px; margin-top: 15px; display: none;
      font-weight: 600; text-align: center;
    }
    .helper-text { margin-top: 22px; font-size: 12px; color: var(--muted); line-height: 1.5; text-align: center; }
    .helper-text strong { color: var(--text); }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="card">
      <div class="logo-circle" aria-hidden="true">🛍️</div>
      <h1>Mi Tienda</h1>
      <p class="subtitle">Accede para administrar tu catálogo</p>

      <form id="form-login" novalidate>
        <div class="form-group">
          <label for="usuario">Usuario de la Tienda</label>
          <input type="text" id="usuario" class="form-control" placeholder="Ej. tienda_luis" autocomplete="username" autocapitalize="none" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrap">
            <input type="password" id="password" class="form-control has-toggle" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="toggle-pass" id="toggle-pass" aria-label="Mostrar contraseña">👁</button>
          </div>
        </div>
        <button type="submit" class="btn-login" id="btn-login">Iniciar Sesión</button>
        <div id="error-msg" class="error-msg" role="alert"></div>
      </form>
      <p class="helper-text">¿Olvidaste tu contraseña?<br>Contacta al <strong>administrador</strong>.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://yhighuruvnzuiotsomya.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InloaWdodXJ1dm56dWlvdHNvbXlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1ODQ3NDMsImV4cCI6MjEwOTE2MDc0M30.8TJK8vYkW5d4tu_H8FI9tTcpWR_LK2fSekQ7hROCGvA'; 
    const DOMINIO_INTERNO = '@tienda.app'; // Usamos un dominio interno distinto para diferenciar
    const RUTA_PANEL = 'panel.html';

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const formLogin = document.getElementById('form-login');
    const inputUsuario = document.getElementById('usuario');
    const inputPassword = document.getElementById('password');
    const btn = document.getElementById('btn-login');
    const errorMsg = document.getElementById('error-msg');
    const togglePass = document.getElementById('toggle-pass');

    function mostrarError(texto) { errorMsg.textContent = texto; errorMsg.style.display = 'block'; }
    function ocultarError() { errorMsg.textContent = ''; errorMsg.style.display = 'none'; }
    function setCargando(c) { btn.disabled = c; inputUsuario.disabled = c; inputPassword.disabled = c; btn.textContent = c ? 'Verificando...' : 'Iniciar Sesión'; }

    (async function redirigirSiHaySesion() {
      const { data } = await sb.auth.getSession();
      if (data && data.session) window.location.href = RUTA_PANEL;
    })();

    togglePass.addEventListener('click', function () {
      const mostrando = inputPassword.type === 'text';
      inputPassword.type = mostrando ? 'password' : 'text';
      togglePass.textContent = mostrando ? '👁' : '🙈';
      inputPassword.focus();
    });

    formLogin.addEventListener('submit', async function (e) {
      e.preventDefault();
      ocultarError();

      const usuario = inputUsuario.value.trim().toLowerCase().replace(/\s+/g, '');
      const password = inputPassword.value;

      if (!usuario || !password) { mostrarError('Escribe tu usuario y contraseña.'); return; }

      setCargando(true);
      try {
        const { error } = await sb.auth.signInWithPassword({
          email: usuario + DOMINIO_INTERNO,
          password: password,
        });
        if (error) throw error;
        
        btn.textContent = '¡Bienvenido!';
        btn.classList.add('success');
        setTimeout(() => window.location.href = RUTA_PANEL, 900);
      } catch (err) {
        setCargando(false);
        mostrarError('Usuario o contraseña incorrectos.');
      }
    });
    inputUsuario.focus();
  </script>
</body>
</html>
