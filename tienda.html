<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda esencial</title>
<meta name="description" content="Huaraches, camisas, shorts, boxers y calcetines. Pide por WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --fondo: #f5f4ef;
    --tarjeta: #ffffff;
    --texto: #1a1d18;
    --suave: #5f6358;
    --linea: #e5e4dc;
    --acento: #5c6b4a;
    --acento-osc: #3d4a30;
    --wa: #1fa855;
    --wa-osc: #168a45;
    --fuente: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --radio: 14px;
    --lateral: clamp(1rem, 4vw, 2.5rem);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--fuente);
    background: var(--fondo);
    color: var(--texto);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  img { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  button, input, select { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }

  .contenedor { max-width: 1300px; margin: 0 auto; padding: clamp(1.5rem, 4vw, 2.5rem) var(--lateral) 6rem; }

  .encabezado { margin-bottom: 1.5rem; }
  .encabezado h1 { font-size: clamp(1.7rem, 1.2rem + 1.8vw, 2.6rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
  .encabezado h1 span { color: var(--acento); font-weight: 300; }
  .encabezado p { color: var(--suave); font-size: .92rem; margin-top: .4rem; }

  /* Barra de herramientas */
  .barra {
    position: sticky; top: 0; z-index: 20;
    background: var(--fondo);
    padding: .75rem 0;
    margin-bottom: 1.25rem;
    border-bottom: 1px solid var(--linea);
    display: grid; gap: .75rem;
  }
  .barra__fila { display: flex; gap: .6rem; flex-wrap: wrap; }
  .campo {
    flex: 1 1 200px;
    padding: .6rem .9rem;
    border: 1px solid var(--linea);
    background: var(--tarjeta);
    border-radius: 8px;
    font-size: .9rem;
  }
  select.campo { flex: 0 0 auto; }
  .filtros { display: flex; gap: .4rem; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .filtros::-webkit-scrollbar { display: none; }
  .filtros button {
    flex: 0 0 auto;
    padding: .5rem .95rem;
    border: 1px solid var(--linea);
    background: var(--tarjeta);
    border-radius: 8px;
    font-size: .82rem; font-weight: 600;
    color: var(--suave);
    transition: color .2s, border-color .2s;
  }
  .filtros button:hover { color: var(--acento); border-color: var(--acento); }
  .filtros button.activo { background: var(--acento); border-color: var(--acento); color: #fff; }
  .conteo { color: var(--suave); font-size: .82rem; margin-bottom: .9rem; }

  /* Catálogo */
  .catalogo { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 1rem; }
  @media (max-width: 520px) { .catalogo { grid-template-columns: repeat(2, 1fr); gap: .7rem; } }

  .tarjeta {
    background: var(--tarjeta);
    border: 1px solid var(--linea);
    border-radius: var(--radio);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  .tarjeta__imagen { position: relative; aspect-ratio: 4 / 5; overflow: hidden; background: var(--linea); width: 100%; display: block; }
  .tarjeta__imagen img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; transition: transform .25s ease; }
  .tarjeta__imagen:hover img { transform: scale(1.04); }
  .tarjeta__info { padding: .85rem .95rem 1rem; display: flex; flex-direction: column; gap: .3rem; flex: 1; }
  .tarjeta__categoria { font-size: .74rem; color: var(--acento); font-weight: 600; }
  .tarjeta__nombre { font-size: .95rem; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; min-height: 2.6em; }
  .tarjeta__precio { margin-top: auto; padding-top: .3rem; font-size: 1.1rem; font-weight: 800; letter-spacing: -.02em; }

  .btn-pedir {
    display: flex; align-items: center; justify-content: center; gap: .45rem;
    padding: .65rem; margin-top: .5rem;
    border-radius: 8px; background: var(--wa); color: #fff;
    font-size: .85rem; font-weight: 700;
    transition: background .2s;
  }
  .btn-pedir:hover { background: var(--wa-osc); }
  .btn-pedir svg, .wa-flotante svg { width: 1.2em; height: 1.2em; flex: none; }

  .vacio { grid-column: 1 / -1; text-align: center; padding: 3rem 1rem; color: var(--suave); }
  .vacio button { margin-top: .75rem; padding: .55rem 1rem; border-radius: 8px; background: var(--acento); color: #fff; font-weight: 600; }

  /* Botón flotante de WhatsApp */
  .wa-flotante {
    position: fixed; right: max(1rem, env(safe-area-inset-right)); bottom: max(1rem, env(safe-area-inset-bottom));
    z-index: 30;
    display: flex; align-items: center; gap: .55rem;
    padding: .85rem 1.2rem;
    border-radius: 999px;
    background: var(--wa); color: #fff;
    font-weight: 700; font-size: .92rem;
    box-shadow: 0 6px 20px rgba(0,0,0,.25);
    transition: background .2s, transform .2s;
  }
  .wa-flotante:hover { background: var(--wa-osc); transform: translateY(-2px); }

  /* Lightbox */
  .lightbox {
    display: none; position: fixed; inset: 0; z-index: 9999;
    background: rgba(0,0,0,.92);
    align-items: center; justify-content: center;
    flex-direction: column; gap: 1rem; padding: 1rem;
  }
  .lightbox.activo { display: flex; }
  .lightbox img {
    max-width: 92vw; max-height: 74vh; width: auto; height: auto;
    border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.5);
    animation: zoomIn .22s ease;
  }
  @keyframes zoomIn { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .lightbox img { animation: none; } .tarjeta__imagen img, .wa-flotante { transition: none; } html { scroll-behavior: auto; } }
  .lightbox__pie { color: #fff; text-align: center; display: grid; gap: .6rem; justify-items: center; }
  .lightbox__pie strong { font-size: 1.05rem; }
  .lightbox__pie .btn-pedir { margin: 0; padding: .7rem 1.5rem; }
  .lightbox__cerrar, .lightbox__nav {
    position: absolute; color: #fff; background: rgba(255,255,255,.12);
    width: 44px; height: 44px; border-radius: 50%;
    font-size: 26px; line-height: 1; display: grid; place-items: center;
    transition: background .2s;
  }
  .lightbox__cerrar:hover, .lightbox__nav:hover { background: rgba(255,255,255,.28); }
  .lightbox__cerrar { top: 14px; right: 14px; }
  .lightbox__nav--prev { left: 12px; top: 45%; }
  .lightbox__nav--sig { right: 12px; top: 45%; }
</style>
</head>
<body>
<div class="contenedor">

  <header class="encabezado">
    <h1 id="titulo"></h1>
    <p id="descripcion"></p>
  </header>

  <div class="barra">
    <div class="barra__fila">
      <input class="campo" id="buscar" type="search" placeholder="Buscar producto" aria-label="Buscar producto">
      <select class="campo" id="orden" aria-label="Ordenar productos">
        <option value="">Ordenar</option>
        <option value="asc">Precio: menor a mayor</option>
        <option value="desc">Precio: mayor a menor</option>
        <option value="az">Nombre: A–Z</option>
      </select>
    </div>
    <nav class="filtros" id="filtros" aria-label="Categorías"></nav>
  </div>

  <p class="conteo" id="conteo" aria-live="polite"></p>
  <main class="catalogo" id="catalogo"></main>
</div>

<a class="wa-flotante" id="waPrincipal" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp">
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.4-2.3-1.4-.9-.8-1.4-1.7-1.6-2-.2-.3 0-.5.1-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.1-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.100 3.200 5.100 4.500.7.3 1.300.5 1.700.6.7.2 1.400.2 1.900.1.600-.1 1.700-.7 1.900-1.400.2-.7.2-1.200.2-1.400-.1-.1-.3-.2-.6-.3ZM12 2a10 10 0 0 0-8.600 15.100L2 22l5-1.300A10 10 0 1 0 12 2Zm0 18.200c-1.500 0-3-.4-4.200-1.200l-.3-.2-3 .8.8-2.900-.2-.3A8.200 8.200 0 1 1 12 20.200Z"/></svg>
  Escríbenos
</a>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Imagen del producto" aria-hidden="true">
  <button class="lightbox__cerrar" id="lbCerrar" aria-label="Cerrar">&times;</button>
  <button class="lightbox__nav lightbox__nav--prev" id="lbPrev" aria-label="Producto anterior">&#8249;</button>
  <button class="lightbox__nav lightbox__nav--sig" id="lbSig" aria-label="Producto siguiente">&#8250;</button>
  <img id="lbImg" src="" alt="">
  <div class="lightbox__pie">
    <strong id="lbNombre"></strong>
    <a class="btn-pedir" id="lbPedir" target="_blank" rel="noopener">Pedir por WhatsApp</a>
  </div>
</div>

<script>
  // ============================================================
  // CONFIGURACIÓN — EDITA AQUÍ NÚMERO, NOMBRE Y TEXTO DE LA TIENDA
  // ============================================================
  const CONFIG = {
    whatsapp: '5215512345678',
    nombre: 'Tienda esencial',
    descripcion: 'Huaraches, camisas, shorts, boxers y calcetines. Elige y pide por WhatsApp.'
  };
  // Las categorías se crean solas a partir de los productos: para una
  // categoría nueva, solo escribe su nombre en "categoria" de un producto.

  // ============================================================
  // PRODUCTOS — AGREGA / EDITA AQUÍ
  // ============================================================
  const PRODUCTOS = [
    { nombre: 'Huarache Piel Trenzado', categoria: 'Calzado', precio: 599, imagen: 'https://picsum.photos/seed/cuaplus-1/500/625' },
    { nombre: 'Huarache Artesanal Suela de Llanta', categoria: 'Calzado', precio: 449, imagen: 'https://picsum.photos/seed/cuaplus-2/500/625' },
    { nombre: 'Huarache Casual Café', categoria: 'Calzado', precio: 529, imagen: 'https://picsum.photos/seed/cuaplus-3/500/625' },
    { nombre: 'Camisa Lino Manga Corta', categoria: 'Camisas', precio: 599, imagen: 'https://picsum.photos/seed/cuaplus-4/500/625' },
    { nombre: 'Camisa Oxford Clásica', categoria: 'Camisas', precio: 699, imagen: 'https://picsum.photos/seed/cuaplus-5/500/625' },
    { nombre: 'Camisa de Cuadros', categoria: 'Camisas', precio: 649, imagen: 'https://picsum.photos/seed/cuaplus-6/500/625' },
    { nombre: 'Short Niño Algodón', categoria: 'Shorts niño', precio: 249, imagen: 'https://picsum.photos/seed/cuaplus-7/500/625' },
    { nombre: 'Short Niño Deportivo', categoria: 'Shorts niño', precio: 279, imagen: 'https://picsum.photos/seed/cuaplus-8/500/625' },
    { nombre: 'Short Niña Playero', categoria: 'Shorts niña', precio: 249, imagen: 'https://picsum.photos/seed/cuaplus-9/500/625' },
    { nombre: 'Short Niña Mezclilla', categoria: 'Shorts niña', precio: 329, imagen: 'https://picsum.photos/seed/cuaplus-10/500/625' },
    { nombre: 'Boxer Clásico', categoria: 'Boxers', precio: 129, imagen: 'https://picsum.photos/seed/cuaplus-11/500/625' },
    { nombre: 'Boxer Deportivo', categoria: 'Boxers', precio: 159, imagen: 'https://picsum.photos/seed/cuaplus-12/500/625' },
    { nombre: 'Calcetines Pack 3 Pares', categoria: 'Calcetines', precio: 179, imagen: 'https://picsum.photos/seed/cuaplus-13/500/625' },
    { nombre: 'Calcetines Tobilleros', categoria: 'Calcetines', precio: 149, imagen: 'https://picsum.photos/seed/cuaplus-14/500/625' }
  ];

  // ============================================================
  // LÓGICA — NO EDITAR
  // ============================================================
  const FALLBACK = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><rect width="400" height="500" fill="#e5e4dc"/><text x="50%" y="50%" fill="#8a8d80" font-family="sans-serif" font-size="18" text-anchor="middle" dominant-baseline="middle">Sin imagen</text></svg>'
  );
  const WA_ICONO = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.600 15.100L2 22l5-1.300A10 10 0 1 0 12 2Zm5.500 12.400c-.3-.1-1.700-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-.9 1.100-.2.200-.3.200-.6.100-.3-.1-1.200-.4-2.300-1.400-.9-.8-1.400-1.700-1.600-2-.2-.3 0-.5.100-.6l.4-.5c.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.1-.7-1.600-.9-2.200-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.500s1.100 2.900 1.200 3.100c.1.2 2.100 3.200 5.100 4.500.7.3 1.300.5 1.700.6.7.2 1.400.2 1.900.1.6-.1 1.700-.7 1.900-1.400.2-.7.2-1.200.2-1.400-.1-.1-.3-.2-.6-.3Z"/></svg>';

  const dinero = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 });
  const CATEGORIAS = ['Todos', ...new Set(PRODUCTOS.map(p => p.categoria))];
  const estado = { categoria: 'Todos', texto: '', orden: '', lista: [], indice: 0 };

  const $ = id => document.getElementById(id);
  const $filtros = $('filtros'), $catalogo = $('catalogo'), $conteo = $('conteo');

  const escapar = t => String(t).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const normal = t => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

  function enlaceWhatsApp(p) {
    const img = new URL(p.imagen, window.location.href).href;
    const msg = `¡Hola! Me interesa: ${p.nombre} - ${dinero.format(p.precio)}.\nImagen del producto:\n${img}\n¿Me das más info?`;
    return `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`;
  }

  function filtrar() {
    let l = PRODUCTOS.filter(p =>
      (estado.categoria === 'Todos' || p.categoria === estado.categoria) &&
      (!estado.texto || normal(p.nombre + ' ' + p.categoria).includes(normal(estado.texto))));
    if (estado.orden === 'asc') l.sort((a, b) => a.precio - b.precio);
    if (estado.orden === 'desc') l.sort((a, b) => b.precio - a.precio);
    if (estado.orden === 'az') l.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
    return l;
  }

  function pintarFiltros() {
    $filtros.innerHTML = CATEGORIAS.map(c =>
      `<button data-cat="${escapar(c)}" class="${c === estado.categoria ? 'activo' : ''}" aria-pressed="${c === estado.categoria}">${escapar(c)}</button>`).join('');
  }

  function pintarCatalogo() {
    estado.lista = filtrar();
    $conteo.textContent = estado.lista.length === 1 ? '1 producto' : `${estado.lista.length} productos`;
    if (!estado.lista.length) {
      $catalogo.innerHTML = `<div class="vacio"><p>No encontramos productos con ese filtro.</p><button id="limpiar">Ver todo</button></div>`;
      return;
    }
    $catalogo.innerHTML = estado.lista.map((p, i) => `
      <article class="tarjeta">
        <button class="tarjeta__imagen" data-i="${i}" aria-label="Ampliar imagen de ${escapar(p.nombre)}">
          <img src="${escapar(p.imagen)}" alt="${escapar(p.nombre)}" loading="lazy" width="500" height="625"
               onerror="this.onerror=null;this.src='${FALLBACK}'">
        </button>
        <div class="tarjeta__info">
          <p class="tarjeta__categoria">${escapar(p.categoria)}</p>
          <h3 class="tarjeta__nombre">${escapar(p.nombre)}</h3>
          <p class="tarjeta__precio">${dinero.format(p.precio)}</p>
          <a class="btn-pedir" href="${enlaceWhatsApp(p)}" target="_blank" rel="noopener">${WA_ICONO} Pedir</a>
        </div>
      </article>`).join('');
  }

  $filtros.addEventListener('click', e => {
    const b = e.target.closest('button[data-cat]');
    if (!b) return;
    estado.categoria = b.dataset.cat;
    pintarFiltros(); pintarCatalogo();
  });
  $('buscar').addEventListener('input', e => { estado.texto = e.target.value.trim(); pintarCatalogo(); });
  $('orden').addEventListener('change', e => { estado.orden = e.target.value; pintarCatalogo(); });
  $catalogo.addEventListener('click', e => {
    if (e.target.closest('#limpiar')) {
      Object.assign(estado, { categoria: 'Todos', texto: '', orden: '' });
      $('buscar').value = ''; $('orden').value = '';
      pintarFiltros(); pintarCatalogo(); return;
    }
    const b = e.target.closest('.tarjeta__imagen');
    if (b) abrir(+b.dataset.i, b);
  });

  $('waPrincipal').href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent('¡Hola! Vengo de la tienda en línea.')}`;

  // Lightbox con navegación
  const $lb = $('lightbox');
  let disparador = null;

  function mostrar(i) {
    const n = estado.lista.length;
    estado.indice = (i + n) % n;
    const p = estado.lista[estado.indice];
    $('lbImg').onerror = function () { this.onerror = null; this.src = FALLBACK; };
    $('lbImg').src = p.imagen;
    $('lbImg').alt = p.nombre;
    $('lbNombre').textContent = `${p.nombre} · ${dinero.format(p.precio)}`;
    $('lbPedir').innerHTML = WA_ICONO + ' Pedir por WhatsApp';
    $('lbPedir').href = enlaceWhatsApp(p);
    const solo = n < 2;
    $('lbPrev').hidden = $('lbSig').hidden = solo;
  }
  function abrir(i, origen) {
    disparador = origen;
    mostrar(i);
    $lb.classList.add('activo');
    $lb.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    $('lbCerrar').focus();
  }
  function cerrar() {
    $lb.classList.remove('activo');
    $lb.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    if (disparador) disparador.focus();
  }
  $('lbCerrar').addEventListener('click', cerrar);
  $('lbPrev').addEventListener('click', () => mostrar(estado.indice - 1));
  $('lbSig').addEventListener('click', () => mostrar(estado.indice + 1));
  $lb.addEventListener('click', e => { if (e.target === $lb) cerrar(); });
  document.addEventListener('keydown', e => {
    if (!$lb.classList.contains('activo')) return;
    if (e.key === 'Escape') cerrar();
    if (e.key === 'ArrowLeft') mostrar(estado.indice - 1);
    if (e.key === 'ArrowRight') mostrar(estado.indice + 1);
  });

  const [palabra1, ...resto] = CONFIG.nombre.split(' ');
  $('titulo').innerHTML = escapar(palabra1) + (resto.length ? ' <span>' + escapar(resto.join(' ')) + '</span>' : '');
  $('descripcion').textContent = CONFIG.descripcion;
  document.title = CONFIG.nombre;

  pintarFiltros();
  pintarCatalogo();
</script>
</body>
</html>
